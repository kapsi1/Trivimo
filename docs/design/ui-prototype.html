<title>Trivimo UI</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700&family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<style>
/* Layout: app shell — stała lewa nawigacja + pasek kontekstu (data/okres) + widok; na telefonie dolny pasek kart. Ciemny motyw z wyboru (decyzja 3). */
:root {
  color-scheme: dark;
  --bg: #0e1317;        /* tło aplikacji */
  --panel: #141b21;     /* nawigacja, karty */
  --raised: #1a232a;    /* elementy aktywne, wiersze tygodni */
  --line: #24303a;
  --line-strong: #34424e;
  --fg: #e4eaef;
  --muted: #98a6b3;
  --faint: #65727e;
  --accent: #6cc7b1;    /* akcja i fokus */
  --accent-ink: #0b1a16;
  --c-body: #8ab4f8;    /* masa, tkanka */
  --c-activity: #6cc7b1;/* kroki, dystans */
  --c-energy: #f2a65a;  /* kalorie */
  --c-band: #c39cf0;    /* tętno / opaska */
  --c-food: #b5d36b;    /* jedzenie (przyszłe) */
  --warn: #e6c34f;
  --bad: #ee6d68;
  --font-display: "Bricolage Grotesque", "Segoe UI", system-ui, sans-serif;
  --font-ui: "IBM Plex Sans", "Segoe UI", system-ui, sans-serif;
  --font-data: "IBM Plex Mono", ui-monospace, "Cascadia Mono", Consolas, monospace;
  --r: 8px;
  --side: 236px;
}
* { box-sizing: border-box; }
html, body { background: var(--bg); color: var(--fg); }
body { font: 14px/1.5 var(--font-ui); }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 30; background: var(--bg); }
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 4px; }
h1, h2, h3 { text-wrap: balance; margin: 0; }
.num { font-variant-numeric: tabular-nums; }
.mono { font-family: var(--font-data); }

/* ---------- shell ---------- */
.app { display: grid; grid-template-columns: var(--side) minmax(0, 1fr); min-height: 100vh; }
.side { position: sticky; top: env(safe-area-inset-top, 0px); height: calc(100vh - env(safe-area-inset-top, 0px)); display: flex; flex-direction: column; gap: 18px; background: var(--panel); border-right: 1px solid var(--line); padding-block: 18px; padding-left: max(14px, env(safe-area-inset-left, 0px)); padding-right: 14px; overflow-y: auto; }
.brand { display: flex; align-items: baseline; gap: 8px; padding: 0 8px; }
.brand b { font: 700 21px/1 var(--font-display); letter-spacing: -.01em; }
.brand span { font: 500 10px/1 var(--font-data); color: var(--faint); letter-spacing: .08em; text-transform: uppercase; }
.navgroup { display: flex; flex-direction: column; gap: 2px; }
.navgroup h4 { margin: 0 0 4px; padding: 0 8px; font: 500 10.5px/1.2 var(--font-data); color: var(--faint); letter-spacing: .1em; text-transform: uppercase; }
.nav { display: flex; align-items: center; gap: 10px; width: 100%; padding: 7px 8px; border: 0; border-radius: 6px; background: transparent; color: var(--muted); text-align: left; text-decoration: none; }
.nav:hover { background: var(--raised); color: var(--fg); }
.nav[aria-current="page"] { background: var(--raised); color: var(--fg); box-shadow: inset 2px 0 0 var(--accent); }
.nav svg { flex: none; width: 17px; height: 17px; stroke: currentColor; fill: none; stroke-width: 1.6; stroke-linecap: round; stroke-linejoin: round; }
.nav .soon { margin-left: auto; }
.nav.is-soon { color: var(--faint); }
.tag { display: inline-flex; align-items: center; gap: 4px; padding: 1px 6px; border-radius: 4px; font: 500 10.5px/1.5 var(--font-data); letter-spacing: .03em; border: 1px solid var(--line-strong); color: var(--muted); white-space: nowrap; }
.tag.food { border-color: color-mix(in srgb, var(--c-food) 45%, transparent); color: var(--c-food); }
.side-foot { margin-top: auto; display: flex; flex-direction: column; gap: 8px; padding: 10px 8px 0; border-top: 1px solid var(--line); font-size: 12.5px; color: var(--muted); }
.sync { display: flex; gap: 8px; align-items: flex-start; background: none; border: 0; padding: 0; text-align: left; color: inherit; }
.dot { flex: none; width: 8px; height: 8px; margin-top: 6px; border-radius: 50%; background: var(--accent); box-shadow: 0 0 0 3px color-mix(in srgb, var(--accent) 20%, transparent); }
.dot.warn { background: var(--warn); box-shadow: 0 0 0 3px color-mix(in srgb, var(--warn) 20%, transparent); }

.main { min-width: 0; display: flex; flex-direction: column; }
.topbar { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 20; display: flex; align-items: center; gap: 12px; flex-wrap: wrap; padding-block: 12px; padding-left: 28px; padding-right: max(28px, env(safe-area-inset-right, 0px)); background: color-mix(in srgb, var(--bg) 92%, transparent); backdrop-filter: blur(8px); border-bottom: 1px solid var(--line); }
.topbar h1 { font: 700 22px/1.1 var(--font-display); letter-spacing: -.01em; margin-right: auto; }
.content { padding-block: 22px 60px; padding-left: 28px; padding-right: max(28px, env(safe-area-inset-right, 0px)); display: flex; flex-direction: column; gap: 22px; max-width: 1400px; width: 100%; }
.proto { font: 500 11px/1.4 var(--font-data); color: var(--warn); border: 1px dashed color-mix(in srgb, var(--warn) 50%, transparent); border-radius: 6px; padding: 6px 8px; }

/* ---------- controls ---------- */
.btn { display: inline-flex; align-items: center; gap: 6px; padding: 6px 12px; border-radius: 6px; border: 1px solid var(--line-strong); background: var(--raised); color: var(--fg); white-space: nowrap; }
.btn:hover { border-color: var(--muted); }
.btn.primary { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); font-weight: 600; }
.btn.ghost { background: transparent; }
.btn[disabled] { opacity: .45; cursor: not-allowed; }
.btn svg { width: 15px; height: 15px; stroke: currentColor; fill: none; stroke-width: 1.8; stroke-linecap: round; }
.iconbtn { display: inline-grid; place-items: center; width: 32px; height: 32px; border-radius: 6px; border: 1px solid var(--line-strong); background: var(--raised); color: var(--fg); }
.iconbtn svg { width: 16px; height: 16px; stroke: currentColor; fill: none; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
.datectl { display: flex; align-items: center; gap: 6px; }
.datectl .label { min-width: 0; padding: 0 6px; font-weight: 500; }
.seg { display: inline-flex; border: 1px solid var(--line-strong); border-radius: 6px; overflow: hidden; }
.seg button { border: 0; background: transparent; padding: 5px 11px; color: var(--muted); border-right: 1px solid var(--line-strong); }
.seg button:last-child { border-right: 0; }
.seg button[aria-pressed="true"] { background: var(--raised); color: var(--fg); box-shadow: inset 0 -2px 0 var(--accent); }
input[type="date"], select, textarea, input[type="text"] { background: var(--raised); border: 1px solid var(--line-strong); border-radius: 6px; padding: 5px 8px; }
label.check { display: inline-flex; gap: 6px; align-items: center; color: var(--muted); }
.menuwrap { position: relative; }
.menu { position: absolute; right: 0; top: calc(100% + 6px); z-index: 40; min-width: 250px; padding: 6px; background: var(--panel); border: 1px solid var(--line-strong); border-radius: var(--r); box-shadow: 0 12px 30px rgb(0 0 0 / .45); display: flex; flex-direction: column; }
.menu button { display: flex; justify-content: space-between; gap: 12px; align-items: center; text-align: left; padding: 8px 10px; border: 0; border-radius: 6px; background: transparent; color: var(--fg); }
.menu button:hover:not([disabled]) { background: var(--raised); }
.menu button[disabled] { color: var(--faint); cursor: default; }

/* ---------- tabs ---------- */
.tabs { display: flex; gap: 2px; border-bottom: 1px solid var(--line); overflow-x: auto; scrollbar-width: none; }
.tabs button { flex: none; display: inline-flex; gap: 6px; align-items: center; border: 0; background: transparent; color: var(--muted); padding: 9px 12px; border-bottom: 2px solid transparent; margin-bottom: -1px; }
.tabs button:hover { color: var(--fg); }
.tabs button[aria-selected="true"] { color: var(--fg); border-bottom-color: var(--accent); }

/* ---------- day: KPI ---------- */
.daytitle { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
.daytitle h2 { font: 700 28px/1.1 var(--font-display); letter-spacing: -.015em; }
.daytitle .meta { color: var(--muted); }
.live { display: inline-flex; align-items: center; gap: 6px; padding: 2px 8px; border-radius: 999px; background: color-mix(in srgb, var(--accent) 14%, transparent); color: var(--accent); font: 500 11.5px/1.5 var(--font-data); }
.live::before { content: ""; width: 6px; height: 6px; border-radius: 50%; background: currentColor; }
.kpis { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 14px; }
.kgroup { display: flex; flex-direction: column; gap: 10px; min-width: 0; }
.kgroup > h3 { display: flex; align-items: center; gap: 8px; font: 500 11px/1.2 var(--font-data); letter-spacing: .1em; text-transform: uppercase; color: var(--muted); }
.kgroup > h3::before { content: ""; width: 8px; height: 8px; border-radius: 2px; background: var(--gc); }
.kcard { display: flex; flex-direction: column; gap: 6px; padding: 14px 14px 12px; background: var(--panel); border: 1px solid var(--line); border-radius: var(--r); text-align: left; color: inherit; min-width: 0; }
.kcard[data-zoom] { cursor: zoom-in; }
.kcard[data-zoom]:hover { border-color: var(--line-strong); }
.k-right { display: inline-flex; align-items: center; gap: 6px; }
.k-fc { margin-left: 10px; font-size: 13px; font-weight: 400; letter-spacing: 0; color: var(--c-energy); font-variant-numeric: tabular-nums; }
.k-fc b { font-weight: 600; }
.chartbtn { display: block; width: 100%; padding: 0; border: 0; background: none; cursor: zoom-in; border-radius: 4px; }
.kcard .k-label { display: flex; justify-content: space-between; gap: 8px; color: var(--muted); font-size: 13px; }
.kcard .k-value { display: flex; align-items: baseline; gap: 6px; font: 500 30px/1.05 var(--font-ui); font-variant-numeric: tabular-nums; letter-spacing: -.01em; }
.kcard .k-value small { font-size: 13px; color: var(--muted); font-weight: 400; letter-spacing: 0; }
.kcard .k-value.none { color: var(--faint); }
.kcard .k-cmp { font-size: 12px; color: var(--muted); font-variant-numeric: tabular-nums; }
.kcard svg { display: block; width: 100%; height: 34px; }
.kcard.placeholder { border-style: dashed; background: transparent; color: var(--muted); justify-content: center; gap: 8px; min-height: 132px; }
.kcard.placeholder p { margin: 0; font-size: 12.5px; }

.chip { display: inline-flex; align-items: center; gap: 4px; padding: 0 6px; border-radius: 4px; font: 500 10.5px/1.6 var(--font-data); white-space: nowrap; }
.chip.prov { color: var(--accent); background: color-mix(in srgb, var(--accent) 12%, transparent); }
.chip.inc { color: var(--muted); background: repeating-linear-gradient(135deg, color-mix(in srgb, var(--muted) 18%, transparent) 0 3px, transparent 3px 6px); border: 1px solid var(--line-strong); }
.chip.miss { color: var(--faint); border: 1px solid var(--line); }
.chip.conf { color: var(--warn); background: color-mix(in srgb, var(--warn) 13%, transparent); }
.chip.bad { color: var(--bad); background: color-mix(in srgb, var(--bad) 13%, transparent); }

.panel { background: var(--panel); border: 1px solid var(--line); border-radius: var(--r); padding: 16px; min-width: 0; }
.panel > header { display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap; margin-bottom: 10px; }
.panel h3 { font: 600 15px/1.3 var(--font-ui); }
.panel .sub { color: var(--muted); font-size: 12.5px; }
.cols2 { display: grid; grid-template-columns: minmax(0, 1.6fr) minmax(0, 1fr); gap: 14px; align-items: start; }
.legend { display: flex; flex-wrap: wrap; gap: 6px 14px; color: var(--muted); font-size: 12px; }
.legend i { display: inline-block; width: 10px; height: 10px; border-radius: 2px; margin-right: 5px; vertical-align: -1px; }
.notes { margin: 0; padding: 0; list-style: none; display: flex; flex-direction: column; gap: 6px; }
.notes li { display: flex; gap: 8px; align-items: baseline; font-size: 13px; }
.notes li::before { content: ""; flex: none; width: 6px; height: 6px; border-radius: 50%; background: var(--warn); transform: translateY(-1px); }
.notes li.ok::before { background: var(--faint); }
textarea { width: 100%; min-height: 84px; resize: vertical; line-height: 1.45; }
.rowend { display: flex; justify-content: flex-end; gap: 8px; align-items: center; margin-top: 8px; color: var(--muted); font-size: 12px; }

svg.chart { display: block; width: 100%; height: auto; overflow: visible; }
svg text { font: 10.5px var(--font-data); fill: var(--faint); }
svg .grid { stroke: var(--line); stroke-width: 1; }
svg .axis { stroke: var(--line-strong); stroke-width: 1; }

/* ---------- empty / placeholder ---------- */
.empty { display: grid; gap: 10px; justify-items: start; padding: 36px 28px; border: 1px dashed var(--line-strong); border-radius: var(--r); color: var(--muted); max-width: 720px; }
.empty h3 { color: var(--fg); font: 700 19px/1.2 var(--font-display); }
.empty p { margin: 0; max-width: 62ch; }
.empty ul { margin: 0; padding-left: 18px; }

/* ---------- table ---------- */
.toolbar { display: flex; flex-wrap: wrap; gap: 10px 14px; align-items: center; }
.toolbar .spacer { flex: 1; }
.twrap { overflow: auto; max-height: calc(100vh - 210px); border: 1px solid var(--line); border-radius: var(--r); background: var(--panel); }
table.days { border-collapse: separate; border-spacing: 0; width: 100%; font-variant-numeric: tabular-nums; }
.days th, .days td { padding: 0 10px; height: 34px; border-bottom: 1px solid var(--line); white-space: nowrap; text-align: right; }
.days thead th { position: sticky; z-index: 3; background: var(--panel); color: var(--muted); font-weight: 500; font-size: 12.5px; }
.days thead tr.g th { top: 0; height: 28px; font: 500 10.5px/1 var(--font-data); letter-spacing: .1em; text-transform: uppercase; text-align: left; border-bottom: 0; }
.days thead tr.g th span { display: block; padding-bottom: 5px; border-bottom: 2px solid var(--gc, var(--line-strong)); }
.days thead tr.c th { top: 28px; }
.days thead th button { border: 0; background: none; color: inherit; padding: 0; font: inherit; }
.days thead th button:hover { color: var(--fg); }
.days .l { text-align: left; }
.days th.date, .days td.date { position: sticky; left: 0; z-index: 2; background: var(--panel); text-align: left; border-right: 1px solid var(--line); }
.days thead th.date { z-index: 4; }
.days td.date { font-family: var(--font-data); font-size: 12.5px; }
.days td.date .wd { display: inline-block; width: 22px; color: var(--faint); }
.days tr.we td.date .wd { color: var(--muted); }
.days tbody tr:hover td { background: var(--raised); }
.days tr.week td { background: var(--bg); color: var(--muted); font-size: 12px; height: 30px; }
.days tr.week td.date { background: var(--bg); font-family: var(--font-ui); }
.cellbtn { border: 0; background: none; padding: 3px 6px; margin: 0 -6px; border-radius: 4px; color: inherit; font: inherit; display: inline-flex; gap: 6px; align-items: center; }
.cellbtn:hover { background: color-mix(in srgb, var(--accent) 12%, transparent); }
.v-none { color: var(--faint); }
.v-prov { color: var(--muted); }
.bandbar { display: inline-flex; align-items: center; gap: 8px; justify-content: flex-end; }
.bandbar i { display: inline-block; width: 44px; height: 6px; border-radius: 3px; background: var(--line); position: relative; overflow: hidden; }
.bandbar i b { position: absolute; inset: 0 auto 0 0; background: var(--c-band); }
td.notes-c { text-align: left; color: var(--muted); max-width: 320px; overflow: hidden; text-overflow: ellipsis; }
td.food-c { color: var(--faint); text-align: center; background: repeating-linear-gradient(135deg, transparent 0 6px, color-mix(in srgb, var(--c-food) 5%, transparent) 6px 7px); }
.daycards { display: none; flex-direction: column; gap: 8px; }
.daycard { display: grid; gap: 6px; padding: 12px; border: 1px solid var(--line); border-radius: var(--r); background: var(--panel); text-align: left; color: inherit; }
.daycard .dc-head { display: flex; justify-content: space-between; gap: 8px; font-family: var(--font-data); font-size: 12.5px; color: var(--muted); }
.daycard .dc-grid { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 6px 10px; font-variant-numeric: tabular-nums; }
.daycard .dc-grid span { display: block; font-size: 11px; color: var(--faint); }

/* ---------- trends ---------- */
.tgrid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 14px; }
.tcard { display: flex; flex-direction: column; gap: 6px; }
.tcard header { display: flex; justify-content: space-between; align-items: baseline; gap: 10px; flex-wrap: wrap; }
.tcard .stat { font-variant-numeric: tabular-nums; color: var(--muted); font-size: 12.5px; }
.tcard .stat b { color: var(--fg); font-weight: 500; font-size: 18px; }
.events { display: flex; flex-wrap: wrap; gap: 8px; }
.event { display: inline-flex; gap: 8px; align-items: center; padding: 4px 10px; border-radius: 6px; background: var(--panel); border: 1px solid var(--line); font-size: 12.5px; color: var(--muted); }
.event b { font: 500 11px var(--font-data); color: var(--fg); }

/* ---------- sources ---------- */
.cards { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, 320px), 1fr)); gap: 14px; }
.src { display: flex; flex-direction: column; gap: 10px; }
.src .state { display: flex; align-items: center; gap: 8px; font-size: 13px; }
.kv { display: grid; grid-template-columns: max-content minmax(0, 1fr); gap: 4px 14px; margin: 0; font-size: 13px; }
.kv dt { color: var(--muted); }
.kv dd { margin: 0; font-variant-numeric: tabular-nums; min-width: 0; }
.src .actions { display: flex; gap: 8px; flex-wrap: wrap; margin-top: auto; }
.src.future { border-style: dashed; background: transparent; }
.prog { display: grid; grid-template-columns: minmax(120px, 190px) minmax(0, 1fr) 84px; gap: 10px; align-items: center; font-size: 13px; }
.prog .track { height: 6px; border-radius: 3px; background: var(--line); overflow: hidden; }
.prog .track b { display: block; height: 100%; background: var(--accent); }
.prog .n { text-align: right; color: var(--muted); font-variant-numeric: tabular-nums; }
.plist { display: flex; flex-direction: column; gap: 8px; }
.heat { overflow-x: auto; padding-bottom: 4px; }
.simple { width: 100%; border-collapse: collapse; font-size: 13px; font-variant-numeric: tabular-nums; }
.simple th, .simple td { text-align: left; padding: 7px 10px; border-bottom: 1px solid var(--line); white-space: nowrap; }
.simple th { color: var(--muted); font-weight: 500; font-size: 12px; }
.tw { overflow-x: auto; }
details.diag summary { cursor: pointer; color: var(--muted); }
details.diag[open] summary { margin-bottom: 10px; }

/* ---------- settings ---------- */
.settings { display: flex; flex-direction: column; gap: 14px; max-width: 860px; }
.setrow { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 14px; align-items: center; padding: 10px 0; border-bottom: 1px solid var(--line); }
.setrow:last-child { border-bottom: 0; }
.setrow p { margin: 2px 0 0; font-size: 12.5px; color: var(--muted); }

/* ---------- drawer ---------- */
.scrim { position: fixed; inset: 0; z-index: 50; background: rgb(0 0 0 / .45); }
.drawer { position: fixed; z-index: 51; top: 0; right: 0; bottom: 0; width: min(440px, 100%); background: var(--panel); border-left: 1px solid var(--line-strong); display: flex; flex-direction: column; padding-top: env(safe-area-inset-top, 0px); padding-bottom: env(safe-area-inset-bottom, 0px); padding-right: env(safe-area-inset-right, 0px); box-shadow: -18px 0 40px rgb(0 0 0 / .35); }
.drawer header { display: flex; justify-content: space-between; align-items: flex-start; gap: 10px; padding: 18px 20px 12px; border-bottom: 1px solid var(--line); }
.drawer header h2 { font: 700 19px/1.2 var(--font-display); }
.drawer header p { margin: 2px 0 0; color: var(--muted); font-size: 12.5px; }
.drawer .body { overflow-y: auto; padding: 16px 20px 28px; display: flex; flex-direction: column; gap: 18px; }
.bigval { display: flex; align-items: baseline; gap: 8px; flex-wrap: wrap; font: 500 36px/1 var(--font-ui); font-variant-numeric: tabular-nums; }
.bigval small { font-size: 15px; color: var(--muted); font-weight: 400; }
.dsec h4 { margin: 0 0 6px; font: 500 10.5px/1.2 var(--font-data); letter-spacing: .1em; text-transform: uppercase; color: var(--faint); }
.dsec p { margin: 0; color: var(--muted); font-size: 13px; }
.split { display: flex; height: 10px; border-radius: 5px; overflow: hidden; background: var(--line); margin: 8px 0 6px; }
.split b { display: block; height: 100%; }
.timeline { margin: 0; padding: 0; list-style: none; display: flex; flex-direction: column; gap: 8px; font-size: 13px; }
.timeline li { display: grid; grid-template-columns: 96px minmax(0, 1fr); gap: 10px; }
.timeline li span:first-child { color: var(--faint); font-family: var(--font-data); font-size: 12px; }

/* ---------- interakcje wykresów ---------- */
.info { flex: none; display: inline-grid; place-items: center; width: 20px; height: 20px; padding: 0; border-radius: 50%; border: 1.5px solid var(--line-strong); background: transparent; color: var(--muted); font: 600 11px/1 var(--font-ui); }
.info:hover { border-color: var(--accent); color: var(--accent); }
.hdr-r { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; justify-content: flex-end; }
.tcard header { justify-content: flex-start; }
.tcard header .stat { margin-left: auto; }
.zoomable { cursor: zoom-in; border-radius: 6px; }
.legend i.i-fc { background: transparent; border: 1.5px dashed var(--c-energy); }
svg .hit { fill: transparent; }
svg .hit:hover { fill: color-mix(in srgb, var(--fg) 8%, transparent); }

function dayTipLines(key, date) {
  const d = BY.get(date), m = MK[key], c = d?.m[key]; if (!c) return [fmtDL(date), '—'];
  const lines = [fmtDL(date), c.v === null ? '—' : `${nf(c.v, m.dec)}${m.unit ? ` ${m.unit}` : ''}`];
  if (key === 'total') { const f = forecast(d); if (f) lines.push(`Prognoza: ${nf(f.total)} kcal`); }
  if (m.group === 'energy' && c.v !== null) lines.push(...energyTip(d.hrWin, dayWindows(d.date)));
  return lines;
}
/** Tooltip kalorii: źródło szacunku i udział okien z tętnem (dla doby albo godziny). */
function energyTip(hr, windows) { if (hr === null) return ['Źródło: nieustalone']; return [`Źródło: ${hr === 0 ? 'telefon' : hr >= windows ? 'opaska' : 'mieszane'}`, `Opaska: ${nf(hr / windows * 100)} %`]; }

function sparkline(key, end, color) {
  const W = 140, H = 34, step = 132 / 13, x = (i) => 4 + i * step;
  const dates = Array.from({ length: 14 }, (_, i) => addDays(end, i - 13));
  const pts = dates.map((dt) => { const c = BY.get(dt)?.m[key]; return c && c.v !== null ? { v: c.v, prov: c.s === 'provisional' } : null; });
  const f = key === 'total' ? forecast(BY.get(end)) : null;
  const vals = pts.filter(Boolean).map((p) => p.v); if (f) vals.push(f.total);
  const hits = dates.map((dt, i) => BY.get(dt) ? `<rect class="hit" x="${x(i) - step / 2}" y="0" width="${step}" height="${H}" ${tipAttr(dayTipLines(key, dt))}/>` : '').join('');
  if (!vals.length) return `<svg viewBox="0 0 ${W} ${H}" aria-hidden="true"><line x1="0" x2="${W}" y1="30" y2="30" class="axis" stroke-dasharray="2 3"/>${hits}</svg>`;
  const bar = MK[key].form === 'bar', max = Math.max(...vals), min = bar ? 0 : Math.min(...vals), span = max - min || 1, y = (v) => 30 - ((v - min) / span) * 26;
  let marks = '';
  if (bar) {
    marks = pts.map((p, i) => p ? `<rect x="${x(i) - 3.5}" y="${y(p.v)}" width="7" height="${Math.max(1, 30 - y(p.v))}" rx="1.5" fill="${color}" opacity="${p.prov ? .45 : i === 13 ? 1 : .55}"/>` : `<rect x="${x(i) - 3.5}" y="29" width="7" height="1" fill="var(--faint)"/>`).join('');
    if (f) marks += `<rect x="${x(13) - 3}" y="${y(f.total)}" width="6" height="${Math.max(0, y(f.now) - y(f.total))}" fill="none" stroke="${color}" stroke-width="1" stroke-dasharray="2 1.5"/>`;
  } else {
    let path = '', open = false; pts.forEach((p, i) => { if (p) { path += `${open ? 'L' : 'M'}${x(i).toFixed(1)},${y(p.v).toFixed(1)}`; open = true; } });
    const lastI = pts.map((p, i) => p ? i : -1).filter((i) => i >= 0).pop();
    marks = `<path d="${path}" fill="none" stroke="${color}" stroke-width="1.6" stroke-linejoin="round"/>${pts.map((p, i) => p ? `<circle cx="${x(i)}" cy="${y(p.v)}" r="${i === lastI ? 2.8 : 1.6}" fill="${color}"/>` : '').join('')}`;
  }
  return `<svg viewBox="0 0 ${W} ${H}" aria-hidden="true">${marks}${hits}</svg>`;
}

function niceTicks(min, max, n = 3) { const span = max - min || 1; const raw = span / n; const mag = 10 ** Math.floor(Math.log10(raw)); const step = [1, 2, 2.5, 5, 10].map((s) => s * mag).find((s) => s >= raw) || mag * 10; const lo = Math.floor(min / step) * step, hi = Math.ceil(max / step) * step; const out = []; for (let v = lo; v <= hi + step / 2; v += step) out.push(+v.toFixed(6)); return out; }

function shiftDay(n) { const d = addDays(S.date, n); if (d < '2026-01-01' || d > TODAY) return; setDay(d); }
function setDay(d) { if (!d || d > TODAY || d < '2026-01-01') return; S.date = d; render(); }

    <div class="tabs" role="tablist">${tabs.map(([k, l, st]) => `<button role="tab" aria-selected="${S.dayTab === k}" onclick="S.dayTab='${k}';render()">${l}${st ? ` <span class="tag ${k === 'jedzenie' ? 'food' : ''}">${st}</span>` : ''}</button>`).join('')}</div>`;

  if (S.dayTab === 'treningi') return head + placeholder('Treningi dnia', 'Sesje z czasem, tętnem, strefami i mapą trasy pojawią się w etapie M2. Kolumna „Treningi” w tabeli będzie ich zwięzłą projekcją.', ['Lista sesji dnia, np. „2 × spacer, 1 × rower”', 'Czas w strefach tętna i AZM osobno', 'Mapa trasy z TCX'], 'M2');

const energyLegend = (d) => `<span><i style="background:var(--c-energy)"></i>aktywne</span><span><i style="background:color-mix(in srgb, var(--c-energy) 32%, transparent)"></i>spalone poza aktywnymi</span>${d.today ? '<span><i class="i-fc"></i>prognoza bez aktywności</span>' : ''}`;
const zoomAttr = (o, label) => `data-zoom="${esc(JSON.stringify(o))}" role="button" tabindex="0" aria-label="Powiększ wykres: ${esc(label)}"`;

function daySummary(d) {
  const groups = ['energy', 'activity', 'body'];
  const f = forecast(d);
  const card = (key) => {
    const m = MK[key], c = d.m[key];
    let cmp = '';
    if (m.group === 'body') { const last = c.v === null ? lastMeasured(key, addDays(d.date, -1)) : null; const avg = meanValid(key, addDays(d.date, -7), addDays(d.date, -1)); cmp = c.v === null ? (last ? `ostatni pomiar ${nf(last.v, m.dec)} ${m.unit} · ${fmtD(last.date)}` : 'brak wcześniejszych pomiarów') : avg.mean !== null ? `śr. 7 dni ${nf(avg.mean, m.dec)} · ${avg.n} z 7 dób` : 'brak pomiarów w 7 dniach'; }
    else { const avg = meanValid(key, addDays(d.date, -7), addDays(d.date, -1)); cmp = avg.mean !== null ? `śr. 7 dni ${nf(avg.mean, m.dec)} · ${avg.n} z ${avg.total} dób` : 'brak potwierdzonych dób w 7 dniach'; }
    if (c.s !== 'valid' && c.why && c.v === null) cmp = esc(c.why);
    const zoom = esc(JSON.stringify({ type: 'day', key }));
    return `<div class="kcard" data-zoom="${zoom}">
      <span class="k-label"><span>${m.label}</span><span class="k-right">${statusChip(c, true)}${infoBtn(`openCell('${d.date}','${key}')`, m.label)}</span></span>
      <span class="k-value ${c.v === null ? 'none' : ''}">${fmtVal(m, c)}${c.v !== null && m.unit ? `<small>${m.unit}</small>` : ''}${key === 'total' && f ? `<span class="k-fc">Prognoza: <b>${nf(f.total)}</b> kcal</span>` : ''}</span>
      <span class="k-cmp">${cmp}</span>
      <button class="chartbtn" data-zoom="${zoom}" aria-label="Powiększ wykres: ${m.label}">${sparkline(key, d.date, GROUPS[m.group].color)}</button></div>`;
  };
  const kpis = `<div class="kpis">${groups.map((g) => `<section class="kgroup" style="--gc:${GROUPS[g].color}"><h3>${GROUPS[g].label}</h3>${METRICS.filter((m) => m.group === g).map((m) => card(m.key)).join('')}${g === 'body' ? hrCard(d) : ''}</section>`).join('')}
    <section class="kgroup" style="--gc:var(--c-food)"><h3>Jedzenie <span class="tag food">M3</span></h3><div class="kcard placeholder"><strong style="color:var(--fg)">Spożyte kalorie i makro</strong><p>Pojawi się z dziennikiem posiłków.</p></div><div class="kcard placeholder"><strong style="color:var(--fg)">Bilans energii</strong><p>Tylko dla dni z porównywalnym wydatkiem; doba z samym BMR nie pokaże deficytu.</p></div></section></div>`;
  const hrs = hourly(d.date);
  const noHours = d.period === 'legacy' || d.gap;
  const strip = `<section class="panel"><header><h3>Doba w skrócie</h3><div class="hdr-r"><div class="legend">${noHours ? '' : energyLegend(d)}${dayHR(d.date) ? '<span><i style="background:var(--c-band)"></i>tętno</span>' : ''}</div>${infoBtn(`openInfo({type:'hourly',date:'${d.date}',key:'total'})`, 'Doba w skrócie')}</div></header>
    ${noHours ? `<p class="sub">${d.gap ? 'Brak odczytu Google dla tej doby.' : 'Starszy model źródła: producent zapisał kalorie w kilku długich przedziałach, więc brak rozkładu godzinowego.'}</p>` : `<div class="zoomable" ${zoomAttr({ type: 'hour', key: 'total', name: 'Doba w skrócie' }, 'doba w skrócie')}>${hourChart(d, hrs, 'total', 120)}</div>`}
    ${dayHR(d.date) ? `<div class="zoomable" style="margin-top:10px" ${zoomAttr({ type: 'hrday' }, 'tętno')}>${hrDayChart(d.date, 76)}</div>` : ''}</section>`;
  const notes = `<section class="panel"><header><h3>Uwagi</h3><span class="sub">automatyczne, z oceny metryk</span></header>${d.notes.length ? `<ul class="notes">${d.notes.map((n) => `<li>${esc(n)}</li>`).join('')}</ul>` : '<ul class="notes"><li class="ok">Brak uwag dla tego dnia.</li></ul>'}
    <header style="margin-top:16px"><h3><label for="usernote">Moja notatka</label></h3><span class="sub">nie zmienia się przy przeliczeniu</span></header>
    <textarea id="usernote" placeholder="Np. trening, choroba, podróż…">${esc(d.userNote)}</textarea><div class="rowend"><span id="notestate">${d.userNote ? 'Zapisano 3 lis, 21:04' : ''}</span><button class="btn" onclick="document.getElementById('notestate').textContent='Zapisano przed chwilą (prototyp)'">Zapisz notatkę</button></div></section>`;
  return kpis + `<div class="cols2">${strip}${notes}</div>`;
}

/** Słupki godzin. Dla spalonych kcal: część poza aktywnymi + aktywne, a dla doby w toku przerywana prognoza bez aktywności. Z o.hr: linia tętna (średnie okien 10-min) na prawej osi. */
function hourChart(d, hrs, key, height = 150, W = 640, o = {}) {
  const H = height, L = 36, B = 18, T = 8, big = H > 200, color = key === 'steps' || key === 'distance' ? 'var(--c-activity)' : 'var(--c-energy)';
  const win = o.hr ? hrWindows(d.date).filter(Boolean) : [], R = win.length ? 40 : 0, PW = W - R;
  const stacked = key === 'total';
  const vals = hrs.flatMap((h) => [h[key], stacked && h.fc !== null ? (h.total ?? 0) + h.fc : null]).filter((v) => v !== null);
  if (!vals.length) return '<p class="sub">Brak danych godzinowych.</p>';
  const ticks = niceTicks(0, Math.max(...vals, 1), big ? 4 : 2), top = ticks.at(-1);
  const n = hrs.length, step = (PW - L) / n, base = H - B, y = (v) => T + (base - T) * (1 - v / top);
  const dec = key === 'distance' ? 2 : 0, unit = { total: 'kcal', active: 'kcal', steps: 'kroków', distance: 'km' }[key];
  const marks = hrs.map((h, i) => {
    const x = L + i * step + 1.5, w = step - 3, op = h.now ? .55 : 1; let s = '';
    if (stacked && h.total !== null) s += `<rect x="${x}" y="${y(h.rest)}" width="${w}" height="${Math.max(0, base - y(h.rest))}" fill="color-mix(in srgb, var(--c-energy) 32%, transparent)" opacity="${op}"/>` + (h.active ? `<rect x="${x}" y="${y(h.total)}" width="${w}" height="${Math.max(0, y(h.rest) - y(h.total))}" fill="var(--c-energy)" opacity="${op}"/>` : '');
    else if (!stacked && h[key] !== null) s += `<rect x="${x}" y="${y(h[key])}" width="${w}" height="${Math.max(.5, base - y(h[key]))}" rx="2" fill="${color}" opacity="${h.now ? .45 : .9}"/>`;
    if (stacked && h.fc !== null) { const s0 = h.total ?? 0; s += `<rect x="${x + .5}" y="${y(s0 + h.fc)}" width="${w - 1}" height="${Math.max(0, y(s0) - y(s0 + h.fc))}" fill="color-mix(in srgb, var(--c-energy) 8%, transparent)" stroke="var(--c-energy)" stroke-width="1" stroke-dasharray="3 2"/>`; }
    else if (h.future) s += `<rect x="${x}" y="${base - 2}" width="${w}" height="2" fill="var(--line-strong)"/>`;
    return s;
  }).join('');
  // linia tętna: średnie okien, przerwy tam, gdzie okna nie mają pomiaru
  let hrSvg = ''; const hourHr = hrs.map(() => []);
  if (win.length) {
    const hticks = niceTicks(Math.max(30, Math.min(...win.map((v) => v.avg)) - 5), Math.max(...win.map((v) => v.avg)) + 5, big ? 4 : 2), h0 = hticks[0], h1 = hticks.at(-1);
    const y2 = (v) => T + (base - T) * (1 - (v - h0) / (h1 - h0)), ws = step / 6, xw = (i) => L + i * ws + ws / 2;
    let path = '', prev = -2; for (const v of win) { path += `${v.i === prev + 1 ? 'L' : 'M'}${xw(v.i).toFixed(1)},${y2(v.avg).toFixed(1)}`; prev = v.i; hourHr[v.hour].push(v.avg); }
    const lone = win.filter((v) => !win.some((u) => u.i === v.i - 1 || u.i === v.i + 1)).map((v) => `<circle cx="${xw(v.i)}" cy="${y2(v.avg)}" r="2" fill="var(--c-band)"/>`).join('');
    hrSvg = `<path d="${path}" fill="none" stroke="var(--c-band)" stroke-width="1.8" stroke-linejoin="round"/>${lone}` + hticks.map((t) => `<text x="${PW + 6}" y="${y2(t) + 3.5}" style="fill:var(--c-band)">${t}</text>`).join('');
  }
  const tip = (h, i) => {
    const l = [h.range];
    if (h.future && !(stacked && h.fc !== null)) l.push('—');
    else if (stacked) { if (h.total !== null) l.push(`${nf(h.total)} kcal`); if (h.fc !== null) l.push(`Prognoza: ${nf((h.total ?? 0) + h.fc)} kcal`); }
    else l.push(h[key] === null ? '—' : `${nf(h[key], dec)} ${unit}`);
    if ((key === 'total' || key === 'active') && !h.future) l.push(...energyTip(h.hr, 6));
    if (hourHr[i].length) l.push(`Tętno: śr. ${nf(hourHr[i].reduce((a, b) => a + b, 0) / hourHr[i].length)} bpm`);
    return l;
  };
  const hits = hrs.map((h, i) => `<rect class="hit" x="${L + i * step}" y="${T}" width="${step}" height="${base - T}" ${tipAttr(tip(h, i))}/>`).join('');
  const every = W > 900 ? 1 : 3;
  return `<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="Rozkład godzinowy, ${unit}${win.length ? ', z tętnem' : ''}">
    ${ticks.map((t) => `<line class="grid" x1="${L}" x2="${PW}" y1="${y(t)}" y2="${y(t)}"/><text x="${L - 6}" y="${y(t) + 3.5}" text-anchor="end">${nf(t, key === 'distance' ? 1 : 0)}</text>`).join('')}
    ${marks}${hrSvg}<line class="axis" x1="${L}" x2="${PW}" y1="${base}" y2="${base}"/>
    ${hrs.map((h, i) => i % every === 0 || h.label.endsWith('′') ? `<text x="${L + i * step + step / 2}" y="${H - 4}" text-anchor="middle">${h.label}</text>` : '').join('')}${hits}</svg>`;
}
/** Mała karta tętna (grupa Ciało): średnia okien, zakres min–maks., 14 dni. */
function hrCard(d) {
  const s = dayHR(d.date), prev = Array.from({ length: 7 }, (_, i) => dayHR(addDays(d.date, i - 7))).filter(Boolean);
  const avg7 = prev.length ? prev.reduce((a, p) => a + p.avg, 0) / prev.length : null, zoom = esc(JSON.stringify({ type: 'hrdays' }));
  return `<div class="kcard" data-zoom="${zoom}">
    <span class="k-label"><span>Tętno</span><span class="k-right">${d.today && s ? '<span class="chip prov">w toku</span>' : ''}${infoBtn(`openInfo({type:'hr',date:'${d.date}'})`, 'Tętno')}</span></span>
    <span class="k-value ${s ? '' : 'none'}">${s ? nf(s.avg) : '—'}${s ? `<small>bpm</small><span class="k-fc" style="color:var(--c-band)">${s.min}–${s.max} bpm</span>` : ''}</span>
    <span class="k-cmp">${s ? (avg7 !== null ? `śr. 7 dni ${nf(avg7)} · ${prev.length} z 7 dób` : 'brak pomiarów w 7 dniach') : 'Brak pomiarów tętna tej doby'}</span>
    <button class="chartbtn" data-zoom="${zoom}" aria-label="Powiększ wykres: Tętno">${hrSpark(d.date)}</button></div>`;
}
function hrSpark(end) {
  const W = 140, H = 34, step = 132 / 13, x = (i) => 4 + i * step;
  const dates = Array.from({ length: 14 }, (_, i) => addDays(end, i - 13)), pts = dates.map((dt) => dayHR(dt)), ok = pts.filter(Boolean);

const trendRange = () => S.trendLen === 308 ? '2026-01-01' : addDays(TODAY, -(S.trendLen - 1));
function trendData(key, from, to, agg = 'dzien') {

  const n = pts.length, step = (W - L) / n, x = (i) => L + i * step + step / 2, y = (v) => T + (H - B - T) * (1 - (v - bot) / (top - bot));
  const idx = (d) => agg === 'tydzien' ? pts.findIndex((p) => p.date === mondayOf(d)) : diffDays(from, d);

}

const RANGES = [[30, '30 dni'], [90, '90 dni'], [365, 'Rok'], [308, 'Od 1 sty']];
const fmtRange = (a, b) => a.slice(0, 4) === b.slice(0, 4) ? `${fmtD(a)} – ${fmtD(b)} ${b.slice(0, 4)}` : `${fmtD(a)} ${a.slice(0, 4)} – ${fmtD(b)} ${b.slice(0, 4)}`;
/** Zdarzenia na osi, wyróżniony dzień i etykiety osi X wspólne dla wykresów okresu. */

    if (e.at && e.at >= from && e.at <= to) { const xi = L + idx(e.at) * step; ev += `<line x1="${xi}" x2="${xi}" y1="${T}" y2="${H - B}" stroke="var(--muted)" stroke-dasharray="3 3"/><text x="${xi + 4}" y="${T - 3}">${e.label}</text>`; }

  return { ev, hl, xTicks };
}

/* ================= tętno ================= */
const HR_LEGEND = '<span><i style="background:var(--c-band)"></i>średnia okna</span><span><i style="background:color-mix(in srgb, var(--c-band) 30%, transparent)"></i>min–maks.</span>';
const hrCache = new Map();
/** Okna 10-minutowe tętna (rollUp 600 s): śr./min/maks. tylko w oknach z pomiarem, pozostałe null (producent je pomija). */
function hrWindows(date) {
  if (hrCache.has(date)) return hrCache.get(date);
  const hrs = hourly(date), rnd = mulberry32(hashStr(date + 'hr')), out = [];
  const maxSteps = Math.max(1, ...hrs.map((h) => h.steps ?? 0));
  hrs.forEach((h, hi) => {
    const hour = parseInt(h.label, 10), sleep = hour < 6 || hour >= 23, inten = (h.steps ?? 0) / maxSteps;
    for (let k = 0; k < 6; k++) {
      if (h.future || k >= h.hr) { out.push(null); continue; }
      const burst = rnd() < inten * 0.5 ? 25 + rnd() * 35 : 0;
      const avg = Math.round((sleep ? 54 : 66) + inten * 36 + burst * 0.6 + (rnd() - .5) * 8);
      const hh = String(hour).padStart(2, '0'), m0 = k * 10, end = k === 5 ? `${String((hour + 1) % 24).padStart(2, '0')}:00` : `${hh}:${m0 + 10}`;
      out.push({ i: out.length, hour: hi, label: `${hh}:${String(m0).padStart(2, '0')}–${end}`, avg, min: Math.round(avg - 3 - rnd() * (sleep ? 4 : 9)), max: Math.round(avg + 4 + rnd() * 10 + burst * 0.5) });

  hrCache.set(date, out); return out;
}
/** Wartości doby do prezentacji: min i maks. okien oraz średnia średnich okien (nie tętno spoczynkowe). */
function dayHR(date) { if (!BY.has(date)) return null; const w = hrWindows(date).filter(Boolean); if (!w.length) return null; return { min: Math.min(...w.map((v) => v.min)), max: Math.max(...w.map((v) => v.max)), avg: w.reduce((a, v) => a + v.avg, 0) / w.length, n: w.length }; }
function hrDayChart(date, H = 150, W = 640) {
  const hrs = hourly(date), win = hrWindows(date), L = 36, B = 18, T = 8, base = H - B;
  const vals = win.filter(Boolean); if (!vals.length) return '<p class="sub">Brak pomiarów tętna tej doby.</p>';
  const ticks = niceTicks(Math.max(30, Math.min(...vals.map((v) => v.min)) - 5), Math.max(...vals.map((v) => v.max)) + 5, H > 200 ? 5 : H < 100 ? 2 : 3), t0 = ticks[0], t1 = ticks.at(-1);
  const n = win.length, step = (W - L) / n, x = (i) => L + i * step + step / 2, y = (v) => T + (base - T) * (1 - (v - t0) / (t1 - t0));

  const lone = vals.filter((v) => !win[v.i - 1] && !win[v.i + 1]).map((v) => `<circle cx="${x(v.i)}" cy="${y(v.avg)}" r="2" fill="var(--c-band)"/>`).join('');
  const hits = vals.map((v) => `<rect class="hit" x="${L + v.i * step}" y="${T}" width="${step}" height="${base - T}" ${tipAttr([v.label, `śr. ${v.avg} bpm`, `${v.min}–${v.max} bpm`])}/>`).join('');
  const every = W > 900 ? 1 : 3;

    ${ticks.map((t) => `<line class="grid" x1="${L}" x2="${W}" y1="${y(t)}" y2="${y(t)}"/><text x="${L - 6}" y="${y(t) + 3.5}" text-anchor="end">${t}</text>`).join('')}
    ${bands}<path d="${path}" fill="none" stroke="var(--c-band)" stroke-width="1.6" stroke-linejoin="round"/>${lone}<line class="axis" x1="${L}" x2="${W}" y1="${base}" y2="${base}"/>
    ${hrs.map((h, i) => i % every === 0 || h.label.endsWith('′') ? `<text x="${L + (i * 6 + 3) * step}" y="${H - 4}" text-anchor="middle">${h.label}</text>` : '').join('')}${hits}</svg>`;

function hrTrendData(from, to, agg = 'dzien') {

}
function hrTrendChart(pts, from, to, o = {}) {

  const ok = pts.filter((p) => p.avg !== null); if (!ok.length) return '<p class="sub">Brak pomiarów tętna w tym okresie.</p>';
  const ticks = niceTicks(Math.max(30, Math.min(...ok.map((p) => p.min)) - 5), Math.max(...ok.map((p) => p.max)) + 5, big ? 5 : 3), t0 = ticks[0], t1 = ticks.at(-1);
  const n = pts.length, step = (W - L) / n, x = (i) => L + i * step + step / 2, y = (v) => T + (H - B - T) * (1 - (v - t0) / (t1 - t0));

  let path = '', open = false; pts.forEach((p, i) => { if (p.avg !== null) { path += `${open ? 'L' : 'M'}${x(i).toFixed(1)},${y(p.avg).toFixed(1)}`; open = true; } });

    <defs><pattern id="hatch" width="6" height="6" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><line x1="0" y1="0" x2="0" y2="6" stroke="var(--line)" stroke-width="2"/></pattern></defs>
    ${ticks.map((t) => `<line class="grid" x1="${L}" x2="${W}" y1="${y(t)}" y2="${y(t)}"/><text x="${L - 6}" y="${y(t) + 3.5}" text-anchor="end">${t}</text>`).join('')}

function hrTrendCards(from, to) {

      <span class="stat">śr. okien <b>${avg === null ? '—' : nf(avg)}</b> · ${ok.length} z ${days.length} dób z pomiarem</span>${infoBtn(`openInfo({type:'hr'})`, 'Tętno')}</header>
      <div class="zoomable" ${zoomAttr({ type: 'hrtrend' }, 'tętno')}>${hrTrendChart(S.trendAgg === 'tydzien' ? hrTrendData(from, to, 'tydzien') : days, from, to, { agg: S.trendAgg })}</div></section>

});
window.addEventListener('scroll', hideTip, true);
document.addEventListener('pointerleave', hideTip);
document.addEventListener('keydown', (e) => {
  if (e.key === 'Escape') { if (S.drawer) closeDrawer(); else if (S.zoom) closeZoom(); else if (S.addOpen) { S.addOpen = false; renderTop(); } return; }
  if ((e.key === 'Enter' || e.key === ' ') && e.target instanceof Element && e.target.matches('div[data-zoom]')) { e.preventDefault(); openZoom(JSON.parse(e.target.dataset.zoom)); return; }
  if (e.target.closest('input,textarea,select')) return;
  if (S.view === 'dzien' && !S.drawer && !S.zoom) { if (e.key === 'ArrowLeft') shiftDay(-1); if (e.key === 'ArrowRight') shiftDay(1); if (e.key === 't') setDay(TODAY); }
});
document.addEventListener('click', (e) => {
  hideTip();
  if (S.addOpen && !e.target.closest('.menuwrap')) { S.addOpen = false; renderTop(); }
  const z = e.target.closest('[data-zoom]'); if (z) openZoom(JSON.parse(z.dataset.zoom));
});
fromHash(); render();
</script>
